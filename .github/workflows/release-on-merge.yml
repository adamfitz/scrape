name: Tag and Release

on:
  push:
    branches:
      - master

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Calculate and push tag
      - name: Calculate and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.SEMVERPAT }}
          tag_prefix: v
          default_bump: patch
          release_branches: master
          create_annotated_tag: true
          fetch_all_tags: true

      # Run GoReleaser only if a tag was actually created
      - name: Run GoReleaser
        if: steps.tag_version.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --rm-dist
          github_token: ${{ secrets.SEMVERPAT }}
