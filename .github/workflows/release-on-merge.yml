name: Tag and

on:
  push:
    branches:
      - master

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Calculate and push tag
      - name: Calculate and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.SEMVERPAT }}
          tag_prefix: v
          default_bump: patch
          release_branches: master
          create_annotated_tag: true
          fetch_all_tags: true

      # Check if tag was pushed successfully
      - name: Determine if GoReleaser Should Run
        id: check
        run: |
          if [ -z "${{ steps.tag.outputs.new_tag }}" ]; then
            echo "run_goreleaser=false" >> $GITHUB_OUTPUT
          else
            echo "run_goreleaser=true" >> $GITHUB_OUTPUT
          fi

      # Run GoReleaser only if tag exists
      - name: Run GoReleaser
        if: steps.check.outputs.run_goreleaser == 'true'
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --rm-dist
          github_token: ${{ secrets.SEMVERPAT }}
