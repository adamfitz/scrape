name: Tag and Release

on:
  push:
    branches:
      - master

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so tags are visible

      # Calculate and push tag
      - name: Calculate and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.SEMVERPAT }}
          tag_prefix: v
          default_bump: patch
          release_branches: master
          create_annotated_tag: true
          fetch_all_tags: true
          push_tag: true   # ensures tag is on current commit

      # Debug outputs
      - name: Debug tag-action outputs
        run: |
          echo "new_tag=${{ steps.tag_version.outputs.new_tag }}"
          echo "tag=${{ steps.tag_version.outputs.tag }}"
          echo "tag_created=${{ steps.tag_version.outputs.tag_created }}"
          echo "previous_tag=${{ steps.tag_version.outputs.previous_tag }}"

      # Run GoReleaser only if a tag was actually created
      - name: Run GoReleaser
        if: steps.tag_version.outputs.new_tag != '' || steps.tag_version.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.SEMVERPAT }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag_version.outputs.new_tag || steps.tag_version.outputs.tag }}
