name: Tag and Release

on:
  push:
    branches:
      - master

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout full repo with history and tags
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 2. Calculate tag
      - name: Calculate Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.SEMVERPAT }}
          tag_prefix: v
          default_bump: patch
          release_branches: master
          create_annotated_tag: true
          fetch_all_tags: true

      # 3. Debug
      - name: Debug
        run: |
          echo "new_tag=${{ steps.tag_version.outputs.new_tag }}"
          echo "previous_tag=${{ steps.tag_version.outputs.previous_tag }}"

      # 4. Fetch tags (tag was created via API, not locally)
      - name: Fetch Tags
        if: steps.tag_version.outputs.new_tag != ''
        run: git fetch --tags

      # 5. Run GoReleaser
      - name: Run GoReleaser
        if: steps.tag_version.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.SEMVERPAT }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag_version.outputs.new_tag }}
